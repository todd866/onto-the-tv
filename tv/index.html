<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
<title>Onto the TV</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="remote-games.css">
<link id="onto-rover-styles" rel="stylesheet" href="number-rover.css">
</head>
<body>
<main id="home">
  <header id="brand">onto<span>the TV</span></header>
  <h1 id="page-title" hidden></h1>
  <section class="row" id="launch-row" aria-label="Channels"><h2>Channels</h2><div class="tiles" id="launch"></div></section>
  <section id="feature" aria-label="Selected programme">
    <div id="feature-art"></div><div class="feature-copy">
      <p id="feature-kind"></p><h1 id="feature-title"></h1><p id="feature-meta"></p><button id="feature-action" tabindex="-1"></button>
    </div>
  </section>
  <section class="row" id="continue-row" hidden><h2>Continue Watching</h2><div class="tiles" id="continue"></div></section>
  <section class="row" id="shows-row"><h2 id="shows-title">Browse shows</h2><div class="tiles" id="shows"></div></section>
  <section class="row" id="live-row" hidden><h2>Live TV</h2><div class="tiles" id="live"></div></section>
  <p id="status" role="status"></p>
</main>
<div id="player" hidden>
  <object id="av" type="application/avplayer" hidden></object>
  <video id="video" preload="auto"></video>
  <div id="osd">
    <div id="osd-title"><span id="osd-show"></span><span id="osd-episode"></span><span id="osd-channel"></span></div>
    <div id="osd-bar"><span id="osd-elapsed">0:00</span><div id="osd-track"><div id="osd-fill"></div></div><span id="osd-duration">0:00</span></div>
    <div id="osd-keys"><span id="osd-play" aria-label="Play or pause">⏸</span><span aria-label="Back 30 seconds">◀ 30s</span><span aria-label="Forward 30 seconds">30s ▶</span><span id="osd-next" aria-label="Next episode">⏭ next</span></div>
  </div>
</div>
<div id="setup" hidden>
  <label for="setup-address">Mac address</label>
  <input id="setup-address" type="text" inputmode="url" autocomplete="off" spellcheck="false">
  <p id="setup-message"></p>
</div>
<script src="config.js"></script>
<script src="diagnostics.js"></script>
<script src="player.js"></script>
<script src="couch.js"></script>
<script src="uke.js"></script>
<script src="number-rover.js"></script>
<script src="remote-games.js"></script>
<script src="game-bridge.js"></script>
<script src="watch-tracker.js"></script>
<script src="watch-delivery.js"></script>
<script src="app.js"></script>
<script src="gamepad.js"></script>
</body>
</html>
