<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onto controller</title><link rel="stylesheet" href="controller.css"></head><body><main><h1>Game controller</h1><form id="pair"><label>TV code <input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off"></label><button>Connect</button></form><section id="pad" hidden><p id="state">Connected</p><div class="keys"><button data-action="up">▲</button><button data-action="left">◀</button><button data-action="ok">OK</button><button data-action="right">▶</button><button data-action="down">▼</button></div><div class="numbers"><button data-action="digit1">1</button><button data-action="digit2">2</button><button data-action="digit3">3</button><button data-action="digit4">4</button><button data-action="digit5">5</button><button data-action="digit6">6</button><button data-action="digit7">7</button><button data-action="digit8">8</button><button data-action="digit9">9</button></div><button id="disconnect">Disconnect</button></section></main><script src="controller.js"></script></body></html>
