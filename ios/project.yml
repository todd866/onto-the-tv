name: OntoTheTV
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: U87MQBZKJ5
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  OntoTheTV:
    type: application
    platform: iOS
    sources:
      - path: OntoTheTV
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iantodd.ontothetv
        PRODUCT_NAME: OntoTheTV
        INFOPLIST_FILE: OntoTheTV/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U87MQBZKJ5
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - OntoTheTVTests
  OntoTheTVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OntoTheTVTests
    dependencies:
      - target: OntoTheTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iantodd.ontothetv.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U87MQBZKJ5
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OntoTheTV.app/OntoTheTV"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  OntoTheTV:
    build:
      targets:
        OntoTheTV: all
        OntoTheTVTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OntoTheTVTests
