<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
<title>Onto the TV</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="remote-games.css">
<link id="onto-rover-styles" rel="stylesheet" href="number-rover.css">
</head>
<body>
<main id="home">
  <div id="top">
    <div id="viewers" role="group" aria-label="Who's watching"></div>
    <div id="top-meta">
      <span id="ceiling" class="rating" hidden></span>
      <time id="clock"></time>
    </div>
  </div>
  <div id="channels"></div>
  <p id="status" role="status"></p>
</main>
<div id="player" hidden>
  <object id="av" type="application/avplayer" hidden></object>
  <video id="video" preload="auto"></video>
  <div id="osd">
    <div id="osd-title"><span id="osd-channel"></span><span id="osd-show"></span><span id="osd-episode"></span></div>
    <div id="osd-bar"><span id="osd-elapsed">0:00</span><div id="osd-track"><div id="osd-fill"></div></div><span id="osd-duration">0:00</span></div>
    <div id="osd-keys"><span id="osd-play" aria-label="Play or pause">⏸</span><span aria-label="Previous scene">◀</span><span aria-label="Next scene">▶</span><span id="osd-next" aria-label="Next episode">⏭</span></div>
  </div>
  <div id="ad-chip" hidden></div>
  <button id="skip-intro" type="button" hidden>Skip intro</button>
  <div id="jump-strip" hidden></div>
  <div id="options" hidden role="group" aria-label="Options">
    <button type="button" class="opt" data-opt="subs"><span class="k">Subtitles</span><span class="v" id="opt-subs">Off</span></button>
    <button type="button" class="opt" data-opt="audio"><span class="k">Audio</span><span class="v" id="opt-audio"></span></button>
    <button type="button" class="opt" data-opt="ads"><span class="k">Ads</span><span class="v" id="opt-ads">Play</span></button>
  </div>
</div>
<div id="setup" hidden>
  <label for="setup-address">Mac address</label>
  <input id="setup-address" type="text" inputmode="url" autocomplete="off" spellcheck="false">
  <p id="setup-message"></p>
</div>
<script src="config.js"></script>
<script src="diagnostics.js"></script>
<script src="player.js"></script>
<script src="nav.js"></script>
<script src="couch.js"></script>
<script src="uke.js"></script>
<script src="number-rover.js"></script>
<script src="remote-games.js"></script>
<script src="game-bridge.js"></script>
<script src="watch-tracker.js"></script>
<script src="watch-delivery.js"></script>
<script src="app.js"></script>
<script src="gamepad.js"></script>
</body>
</html>
