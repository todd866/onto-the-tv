<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Onto the TV">
<title>Onto the TV</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header id="bar"><span class="brand">Onto the TV</span><span id="me" title=""></span></header>
<section id="player" hidden>
  <video id="video" controls playsinline preload="metadata"></video>
  <div id="transport">
    <span id="ch-now" class="num"></span>
    <span id="title" class="title"></span>
    <button id="next" type="button" aria-label="Next on this channel" title="Next on this channel">⏭ Next</button>
  </div>
</section>
<ul id="channels" aria-label="Channels"></ul>
<p id="status" role="status"></p>
<script src="/app.js"></script>
</body>
</html>
