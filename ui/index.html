<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; frame-src file: about:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Onto the TV</title>
  <link rel="icon" href="../brand/onto-the-tv-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="toolbar">
      <div class="brand"><img src="../brand/onto-the-tv-icon.png" width="30" height="30" alt=""><h1>Onto the TV</h1></div>
      <nav class="modes" aria-label="Where to watch">
        <button id="mode-local" class="selected" aria-pressed="true">Channels</button>
        <button id="mode-tv" aria-pressed="false">TV</button>
      </nav>
      <button id="library-toggle" title="Library settings" aria-label="Library settings">⚙</button>
    </header>
    <section id="local-view" aria-label="Channels">
      <iframe id="channel-player" title="Channels" sandbox="allow-scripts allow-same-origin" allow="autoplay *; fullscreen *" allowfullscreen hidden></iframe>
      <div id="empty-library" hidden><button class="primary" id="start-library">Choose videos…</button></div>
    </section>
    <section class="library-drawer" id="library-settings" hidden aria-label="Library settings">
      <div class="drawer-heading"><h2>Library</h2><button id="library-close" aria-label="Close library settings">✕</button></div>
      <p class="path" id="library-path"></p>
      <div class="actions"><button id="choose-library">Choose folder…</button><button id="build-shuffler">Refresh</button></div>
      <details><summary>Channel setup</summary>
        <p class="small quiet">Unassigned shows go to Everything.</p>
        <div class="actions"><button id="choose-tiers">Show groups…</button><button id="choose-sources">More folders…</button><button id="choose-player">Import library…</button></div>
        <p class="small quiet" id="config-summary"></p>
      </details>
    </section>
    <section id="tv-view" hidden aria-label="Samsung TV playback">
      <button class="gate" id="gate">
        <span class="drop-symbol" aria-hidden="true">↗</span>
        <span class="invite">Drop a video here</span>
        <span class="browse">Choose a video</span>
      </button>
      <p class="quiet small" id="room">Connect a TV below.</p>
      <section class="deck" id="deck" hidden aria-label="TV queue">
        <div class="now"><p id="now-title"></p><p id="now-time"></p></div>
        <progress id="progress" max="100" value="0" aria-label="TV playback progress"></progress>
        <div class="actions"><button id="pause">Pause</button><button id="resume">Resume</button><button id="stop">Stop</button></div>
        <ol id="queue"></ol>
      </section>
      <details class="settings" id="tv-settings">
        <summary>Connection</summary>
        <form id="tv-form">
          <label>TV address<input id="tv-host" placeholder="192.168.1.50" autocomplete="off" spellcheck="false"></label>
          <p class="small quiet">Same Wi-Fi as this Mac.</p>
          <details><summary class="small">Advanced</summary>
            <label>TV control address<input id="av-transport" type="url" placeholder="Leave blank for the Samsung default" spellcheck="false"></label>
            <label>Mac Wi-Fi address<input id="bind-host" placeholder="Automatic" spellcheck="false"></label>
          </details>
          <button class="primary" type="submit">Save</button>
        </form>
      </details>
    </section>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
